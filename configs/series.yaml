# 데이터 사전 (기획서 9장 필드 준수)
# 모든 시리즈는 한국은행 ECOS 오픈API에서 수집.
# unit: 금리는 연 % (percent). 변화량 파생변수는 bp로 별도 생성하며 변수명에 단위를 넣는다.

meta:
  source: "한국은행 ECOS 오픈API (https://ecos.bok.or.kr)"
  license_note: "한국은행 공공데이터. 출처 표시 후 이용 가능."
  start_date: "20100101"
  # end_date는 수집 시점의 최신 영업일로 자동 설정

series:
  # ---------- 국고채 수익률 곡선 (모듈 1) ----------
  - variable_name: ktb1y_pct
    description: 국고채 1년 수익률
    stat_code: 817Y002
    item_code: "010190000"
    tenor_years: 1.0
    group: curve
    unit: percent
    frequency: D
    transform: level
    missing_rule: ffill_max5d
    available_from: "20000201"

  - variable_name: ktb2y_pct
    description: 국고채 2년 수익률
